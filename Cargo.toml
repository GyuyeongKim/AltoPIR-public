[package]
name = "altopir"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 AND MIT"
description = "Batched hintless private information retrieval on the matrix accelerators of server CPUs"
autobenches = false

[build-dependencies]
cc = "1.0"

[dependencies]
spiral-rs = { git = "https://github.com/menonsamir/spiral-rs.git", branch = "avoid-avx512" }
rand = { version = "0.8.5", features = ["small_rng"] }
rand_chacha = "0.3.1"
serde_json = "1.0"
serde = { version = "1.0.160", features = ["derive"] }
fastrand = "2.0.0"
log = "0.4.20"

[dev-dependencies]
env_logger = "0.11.1"
test-log = "0.2.14"

[profile.release]
opt-level = 3

[profile.test]
opt-level = 3

[[bin]]
name = "altopir"
path = "src/bin/altopir.rs"
